name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-test:
    name: Build, test and secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore EmployeeSync.sln

      - name: Build
        run: dotnet build EmployeeSync.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/EmployeeSync.UnitTests --configuration Release --no-build

      - name: Integration tests (SQLite)
        run: dotnet test tests/EmployeeSync.IntegrationTests --configuration Release --no-build

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
