name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  build-test:
    name: Build, test and secret scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore EmployeeSync.sln

      - name: Build
        run: dotnet build EmployeeSync.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test tests/EmployeeSync.UnitTests --configuration Release --no-build

      - name: Integration tests (SQLite)
        run: dotnet test tests/EmployeeSync.IntegrationTests --configuration Release --no-build

      # The project is outside the solution so a local `dotnet test` stays
      # Docker-free, but the hosted runner has Docker available.
      - name: Testcontainers tests (SQL Server + NATS)
        run: dotnet test tests/EmployeeSync.Testcontainers --configuration Release

      - name: Secret scan
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:latest detect \
            --source=/repo \
            --config=/repo/.gitleaks.toml \
            --redact \
            --exit-code 2
