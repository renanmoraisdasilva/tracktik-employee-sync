services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1"
          || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa
          -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"
          || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  nats:
    image: nats:2-alpine
    command: ["-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__EmployeeSync: >-
        Server=sqlserver,1433;Database=EmployeeSync;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True
      TrackTik__BaseUrl: ${TRACKTIK_BASE_URL}
      TrackTik__TokenUrl: ${TRACKTIK_TOKEN_URL}
      TrackTik__ClientId: ${TRACKTIK_CLIENT_ID}
      TrackTik__ClientSecret: ${TRACKTIK_CLIENT_SECRET}
      TrackTik__Scope: ${TRACKTIK_SCOPE:-}
      Events__Mode: ${EVENTS_MODE:-Nats}
      Nats__Url: ${NATS_URL:-nats://nats:4222}
      Nats__Subject: ${NATS_SUBJECT:-tracktik.employees.synced}
      Database__AutoMigrate: "true"
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      nats:
        condition: service_started
    restart: unless-stopped

volumes:
  sqlserver-data:
